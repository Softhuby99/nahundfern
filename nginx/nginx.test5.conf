# test5 main config: port 443 is split by hostname (SNI) BEFORE TLS.
# - tdh.servuswir.de  -> passed through untouched to the "tacho" container
#   (it keeps using its own certificate).
# - everything else   -> local HTTPS server of the travel blog (port 8443).

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

stream {
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $ssl_preread_server_name $tls_backend {
        tdh.servuswir.de  tacho:443;
        default           127.0.0.1:8444;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $tls_backend;
        proxy_connect_timeout 10s;
    }

    # Blog traffic: add PROXY protocol so the blog still sees real client IPs.
    server {
        listen 127.0.0.1:8444;
        proxy_pass 127.0.0.1:8443;
        proxy_protocol on;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" host=$host';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
